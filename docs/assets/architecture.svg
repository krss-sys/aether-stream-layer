<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" role="img" aria-labelledby="t d">
<title id="t">Life of a connection in Aether Stream Layer</title>
<desc id="d">Clients connect to a main-thread accept loop that polls the listening socket, wraps each accepted socket in an RAII FileDescriptor and submits a handle_echo task to a thread-safe queue. One of eight pool workers pops the task and serves that connection until it closes, echoing each decoded frame back to the client.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#11131d"/></linearGradient>
  <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".045"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6e7681"/></marker>
  <marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#c084fc" fill-opacity=".7"/></marker>
  <clipPath id="card"><rect width="1000" height="486" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="486" fill="url(#bg)"/><rect width="1000" height="486" fill="url(#dots)"/>
  <text x="36" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="700" >Life of a connection</text>
  <text x="36" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" >blocking I/O · one worker serves one connection for its whole lifetime</text>
  <rect x="36" y="74" width="46" height="3" rx="1.5" fill="url(#hl)"/>

  <text x="60" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681" text-anchor="middle" font-weight="400" letter-spacing="2">CLIENTS</text>
  <line x1="78" y1="150" x2="170" y2="230" stroke="#30363d" stroke-width="1.5"/><line x1="78" y1="230" x2="170" y2="230" stroke="#30363d" stroke-width="1.5"/><line x1="78" y1="310" x2="170" y2="230" stroke="#30363d" stroke-width="1.5"/><g><circle cx="60" cy="150" r="17" fill="#0f1623" stroke="#60a5fa" stroke-opacity=".7" stroke-width="1.5"/><circle cx="60" cy="150" r="5" fill="#60a5fa"/></g><g><circle cx="60" cy="230" r="17" fill="#0f1623" stroke="#60a5fa" stroke-opacity=".7" stroke-width="1.5"/><circle cx="60" cy="230" r="5" fill="#60a5fa"/></g><g><circle cx="60" cy="310" r="17" fill="#0f1623" stroke="#60a5fa" stroke-opacity=".7" stroke-width="1.5"/><circle cx="60" cy="310" r="5" fill="#60a5fa"/></g>

  <!-- accept loop -->
  <line x1="350" y1="230" x2="408" y2="230" stroke="#30363d" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="170" y="150" width="180" height="160" rx="12" fill="#0f1623" stroke="#60a5fa" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="260" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="400" letter-spacing="2">MAIN THREAD</text>
  <text x="260" y="202" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700" >TcpServer::run()</text>
  <text x="260" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" >poll(listen_fd, 500 ms)</text>
  <text x="260" y="246" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" >accept_one()</text>
  <text x="260" y="266" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" >→ FileDescriptor (RAII)</text>
  <text x="260" y="288" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" >SO_RCVTIMEO = 1 s</text>

  <!-- queue -->
  <line x1="590" y1="230" x2="656" y2="230" stroke="#30363d" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="410" y="150" width="180" height="160" rx="12" fill="#0f1623" stroke="#c084fc" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="500" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#c084fc" text-anchor="middle" font-weight="400" letter-spacing="2">TASK QUEUE</text>
  <text x="500" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700" >ThreadSafeQueue</text>
  <rect x="416" y="206" width="36" height="48" rx="6" fill="none" stroke="#30363d" stroke-dasharray="3 3"/><rect x="460" y="206" width="36" height="48" rx="6" fill="none" stroke="#30363d" stroke-dasharray="3 3"/><rect x="504" y="206" width="36" height="48" rx="6" fill="none" stroke="#30363d" stroke-dasharray="3 3"/><rect x="548" y="206" width="36" height="48" rx="6" fill="none" stroke="#30363d" stroke-dasharray="3 3"/>
  <text x="500" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="400" >mutex + condition_variable</text>
  <text x="500" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#f0b429" text-anchor="middle" font-weight="400" >9th+ connection waits here</text>

  <!-- pool -->
  <rect x="660" y="84" width="300" height="300" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="676" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700" >ThreadPool</text>
  <text x="780" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400" >· 8 workers · handle_echo()</text>
  <g><rect x="676" y="120" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"><animate attributeName="stroke" dur="5s" begin="0.0s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#30363d;#30363d;#60a5fa;#60a5fa;#30363d" /><animate attributeName="fill" dur="5s" begin="0.0s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#0f1623;#0f1623;#16294a;#16294a;#0f1623" /></rect><text x="690" y="142" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W1</text><text x="690" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="790" cy="145" r="4" fill="#3fb950" opacity=".25"><animate attributeName="opacity" dur="5s" begin="0.0s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="0.25;0.25;1;1;0.25" /></circle></g><g><rect x="816" y="120" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"></rect><text x="830" y="142" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W2</text><text x="830" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="930" cy="145" r="4" fill="#6e7681"/></g><g><rect x="676" y="180" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"></rect><text x="690" y="202" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W3</text><text x="690" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="790" cy="205" r="4" fill="#6e7681"/></g><g><rect x="816" y="180" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"><animate attributeName="stroke" dur="5s" begin="1.7s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#30363d;#30363d;#60a5fa;#60a5fa;#30363d" /><animate attributeName="fill" dur="5s" begin="1.7s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#0f1623;#0f1623;#16294a;#16294a;#0f1623" /></rect><text x="830" y="202" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W4</text><text x="830" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="930" cy="205" r="4" fill="#3fb950" opacity=".25"><animate attributeName="opacity" dur="5s" begin="1.7s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="0.25;0.25;1;1;0.25" /></circle></g><g><rect x="676" y="240" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"></rect><text x="690" y="262" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W5</text><text x="690" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="790" cy="265" r="4" fill="#6e7681"/></g><g><rect x="816" y="240" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"></rect><text x="830" y="262" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W6</text><text x="830" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="930" cy="265" r="4" fill="#6e7681"/></g><g><rect x="676" y="300" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"><animate attributeName="stroke" dur="5s" begin="3.4s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#30363d;#30363d;#60a5fa;#60a5fa;#30363d" /><animate attributeName="fill" dur="5s" begin="3.4s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="#0f1623;#0f1623;#16294a;#16294a;#0f1623" /></rect><text x="690" y="322" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W7</text><text x="690" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="790" cy="325" r="4" fill="#3fb950" opacity=".25"><animate attributeName="opacity" dur="5s" begin="3.4s" repeatCount="indefinite" keyTimes="0.0000;0.7600;0.8000;0.9700;1.0000" values="0.25;0.25;1;1;0.25" /></circle></g><g><rect x="816" y="300" width="128" height="50" rx="9" fill="#0f1623" stroke="#30363d" stroke-width="1.5"></rect><text x="830" y="322" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#e6edf3">W8</text><text x="830" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">blocked in recv()</text><circle cx="930" cy="325" r="4" fill="#6e7681"/></g>

  <!-- echo return path -->
  <path d="M740,384 V420 H60 V338" fill="none" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arp)">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="440" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400" >recv_some → FrameDecoder → encode_frame → send_all  (echo)</text>

  <circle r="5.5" fill="#60a5fa" opacity="0"><animateMotion dur="5s" begin="0.0s" repeatCount="indefinite" path="M78,150 L170,230 L590,230 L660,230 L690,145" keyTimes="0;.8;1" keyPoints="0;1;1" calcMode="linear"/><animate attributeName="opacity" dur="5s" begin="0.0s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.7800;0.8000;1.0000" values="0;1;1;0;0" /></circle><circle r="5.5" fill="#60a5fa" opacity="0"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M78,230 L170,230 L590,230 L660,230 L830,205" keyTimes="0;.8;1" keyPoints="0;1;1" calcMode="linear"/><animate attributeName="opacity" dur="5s" begin="1.7s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.7800;0.8000;1.0000" values="0;1;1;0;0" /></circle><circle r="5.5" fill="#60a5fa" opacity="0"><animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M78,310 L170,230 L590,230 L660,230 L690,325" keyTimes="0;.8;1" keyPoints="0;1;1" calcMode="linear"/><animate attributeName="opacity" dur="5s" begin="3.4s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.7800;0.8000;1.0000" values="0;1;1;0;0" /></circle><circle r="5.5" fill="#c084fc" opacity="0"><animateMotion dur="4.4s" begin="1.2s" repeatCount="indefinite" path="M740,376 V420 H60 V336"/><animate attributeName="opacity" dur="4.4s" begin="1.2s" repeatCount="indefinite" keyTimes="0.0000;0.0600;0.9200;1.0000" values="0;1;1;0" /></circle>
  <circle cx="60" cy="462" r="4.5" fill="#3fb950"/><text x="72" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400" >serving a connection</text><circle cx="260" cy="462" r="4.5" fill="#6e7681"/><text x="272" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400" >idle · blocked in recv()</text><circle cx="470" cy="462" r="4.5" fill="#60a5fa"/><text x="482" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400" >frame in</text><circle cx="590" cy="462" r="4.5" fill="#c084fc"/><text x="602" y="466" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="start" font-weight="400" >frame echoed back</text>
</g>
<rect x=".5" y=".5" width="999" height="485" rx="17.5" fill="none" stroke="#30363d"/>
</svg>
