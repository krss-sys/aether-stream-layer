<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
<title id="t">Aether Stream Layer</title>
<desc id="d">Animated banner: the word AETHER drawn in a blue to purple gradient, with length-prefixed frames streaming between a client and a server.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#11131d"/></linearGradient>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="504" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
  <radialGradient id="gb"><stop offset="0" stop-color="#3b82f6" stop-opacity=".30"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gp"><stop offset="0" stop-color="#a855f7" stop-opacity=".28"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".055"/></pattern>
  <filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="card"><rect width="1000" height="340" rx="18"/></clipPath>
  <clipPath id="tc0"><rect x="244" y="282" height="30" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0001;0.0600;0.2200;0.2500;1.0000" values="0;0;720;720;0;0"/></rect></clipPath><clipPath id="tc1"><rect x="244" y="282" height="30" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.3100;0.4700;0.5000;1.0000" values="0;0;720;720;0;0"/></rect></clipPath><clipPath id="tc2"><rect x="244" y="282" height="30" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5600;0.7200;0.7500;1.0000" values="0;0;720;720;0;0"/></rect></clipPath><clipPath id="tc3"><rect x="244" y="282" height="30" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.7500;0.8100;0.9700;1.0000;1.0000" values="0;0;720;720;0;0"/></rect></clipPath>
  <style>
    .l{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .d{stroke:url(#g);stroke-dasharray:1 3;animation:draw 1.5s cubic-bezier(.65,0,.35,1) backwards}
    .gl{stroke:url(#g)}
    .fade{animation:fade 1.2s ease 1.3s backwards}
    @keyframes draw{from{stroke-dashoffset:1.15}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.d,.fade{animation:none}}
  </style>
</defs>

<g clip-path="url(#card)">
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#dots)"/>
  <circle cx="230" cy="110" r="230" fill="url(#gb)"><animate attributeName="cx" values="230;330;230" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="190" r="250" fill="url(#gp)"><animate attributeName="cx" values="790;690;790" dur="18s" repeatCount="indefinite"/></circle>

  <text x="500" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="3.2" fill="#8b949e" class="fade">C++20  ·  POSIX SOCKETS  ·  THREAD POOL  ·  LINUX</text>

  <g transform="translate(248,64)">
    <g class="gl" filter="url(#blur)" opacity="0"><path d="M4 80 L32 4 L60 80" class="l"/><path d="M15 54 H49" class="l"/><path d="M146 4 H96 V80 H146" class="l"/><path d="M96 42 H136" class="l"/><path d="M178 4 H238" class="l"/><path d="M208 4 V80" class="l"/><path d="M272 4 V80" class="l"/><path d="M320 4 V80" class="l"/><path d="M272 42 H320" class="l"/><path d="M410 4 H360 V80 H410" class="l"/><path d="M360 42 H400" class="l"/><path d="M448 80 V4 H478 C496 4 496 44 478 44 H448" class="l"/><path d="M476 44 L498 80" class="l"/>
      <animate attributeName="opacity" values="0;0;.6;.32;.6" keyTimes="0;.12;.3;.65;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <g><path d="M4 80 L32 4 L60 80" class="l d" pathLength="1" style="animation-delay:0.00s"/><path d="M15 54 H49" class="l d" pathLength="1" style="animation-delay:0.00s"/><path d="M146 4 H96 V80 H146" class="l d" pathLength="1" style="animation-delay:0.16s"/><path d="M96 42 H136" class="l d" pathLength="1" style="animation-delay:0.16s"/><path d="M178 4 H238" class="l d" pathLength="1" style="animation-delay:0.32s"/><path d="M208 4 V80" class="l d" pathLength="1" style="animation-delay:0.32s"/><path d="M272 4 V80" class="l d" pathLength="1" style="animation-delay:0.48s"/><path d="M320 4 V80" class="l d" pathLength="1" style="animation-delay:0.48s"/><path d="M272 42 H320" class="l d" pathLength="1" style="animation-delay:0.48s"/><path d="M410 4 H360 V80 H410" class="l d" pathLength="1" style="animation-delay:0.64s"/><path d="M360 42 H400" class="l d" pathLength="1" style="animation-delay:0.64s"/><path d="M448 80 V4 H478 C496 4 496 44 478 44 H448" class="l d" pathLength="1" style="animation-delay:0.80s"/><path d="M476 44 L498 80" class="l d" pathLength="1" style="animation-delay:0.80s"/></g>
  </g>

  <text x="500" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17" letter-spacing="13" fill="#8b949e" class="fade">STREAM  LAYER</text>

  <line x1="86" y1="241" x2="914" y2="241" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/>
  </line>
  <circle cx="70" cy="241" r="14" fill="none" stroke="#60a5fa" stroke-opacity=".35"><animate attributeName="r" values="9;15;9" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0;.6" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="70" cy="241" r="6" fill="#60a5fa"/>
  <rect x="918" y="231" width="20" height="20" rx="5" fill="none" stroke="#c084fc" stroke-width="2"/>
  <rect x="924" y="237" width="8" height="8" rx="2" fill="#c084fc"/>
  <text x="70" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e7681">client</text>
  <text x="928" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#6e7681">server</text>
  <rect y="226" width="22" height="9" rx="4.5" fill="url(#pg)" opacity="0"><animate attributeName="x" from="86" to="892" dur="4.6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="0.0s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect><rect y="226" width="34" height="9" rx="4.5" fill="url(#pg)" opacity="0"><animate attributeName="x" from="86" to="880" dur="4.6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="1.5s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect><rect y="226" width="18" height="9" rx="4.5" fill="url(#pg)" opacity="0"><animate attributeName="x" from="86" to="896" dur="4.6s" begin="3.0s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="3.0s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect><rect y="247" width="26" height="9" rx="4.5" fill="#c084fc" fill-opacity=".55" opacity="0"><animate attributeName="x" from="888" to="86" dur="4.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="0.8s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect><rect y="247" width="16" height="9" rx="4.5" fill="#c084fc" fill-opacity=".55" opacity="0"><animate attributeName="x" from="898" to="86" dur="4.6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="2.3s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect><rect y="247" width="30" height="9" rx="4.5" fill="#c084fc" fill-opacity=".55" opacity="0"><animate attributeName="x" from="884" to="86" dur="4.6s" begin="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" dur="4.6s" begin="3.8s" repeatCount="indefinite" keyTimes="0.0000;0.0800;0.9000;1.0000" values="0;1;1;0" /></rect>

  <g clip-path="url(#tc0)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.0001;0.0150;0.2200;0.2500;1.0000" values="0;0;1;1;0;0"/><text x="250" y="302" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"><tspan fill="#60a5fa">›</tspan><tspan fill="#c9d1d9" dx="8">length-prefixed frames  ·  big-endian  ·  1 MiB hard cap</tspan></text></g><g clip-path="url(#tc1)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.2650;0.4700;0.5000;1.0000" values="0;0;1;1;0;0"/><text x="250" y="302" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"><tspan fill="#60a5fa">›</tspan><tspan fill="#c9d1d9" dx="8">one blocking ThreadPool  ·  8 workers  ·  queue-backed accept loop</tspan></text></g><g clip-path="url(#tc2)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5150;0.7200;0.7500;1.0000" values="0;0;1;1;0;0"/><text x="250" y="302" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"><tspan fill="#60a5fa">›</tspan><tspan fill="#c9d1d9" dx="8">RAII file descriptors  ·  graceful SIGINT / SIGTERM shutdown</tspan></text></g><g clip-path="url(#tc3)" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0.0000;0.7500;0.7650;0.9700;1.0000;1.0000" values="0;0;1;1;0;0"/><text x="250" y="302" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"><tspan fill="#60a5fa">›</tspan><tspan fill="#c9d1d9" dx="8">Release  ·  ASan  ·  TSan  ·  UBSan  —  on every push</tspan></text></g>
</g>
<rect x=".5" y=".5" width="999" height="339" rx="17.5" fill="none" stroke="#30363d"/>
</svg>
