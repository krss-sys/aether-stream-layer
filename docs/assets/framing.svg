<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
<title id="t">Aether wire protocol framing</title>
<desc id="d">Three frames arrive coalesced in a single TCP byte stream. Each frame is a 4-byte big-endian length followed by that many payload bytes. FrameDecoder splits the stream back into whole frames. A header claiming more than 1 MiB is rejected and the connection is closed without allocating memory.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#11131d"/></linearGradient>
  <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".045"/></pattern>
  <clipPath id="card"><rect width="1000" height="380" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1000" height="380" fill="url(#bg)"/><rect width="1000" height="380" fill="url(#dots)"/>
  <text x="36" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">One TCP byte stream in → whole frames out</text>
  <text x="36" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">TCP has no message boundaries. Coalesced or fragmented, FrameDecoder rebuilds them.</text>
